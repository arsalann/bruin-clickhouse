name: bruin_shop.t1_shopify_products_connection_test
type: ingestr
description: "Temporary 10-row Shopify products landing asset used to verify the Shopify connection."

# This intentionally creates a disposable table. It is not part of the demo's
# synthetic-source lineage and can be rerun to test the configured connection.
materialization:
  type: table
  strategy: create+replace

parameters:
  source_connection: shopify
  source_table: products
  destination: clickhouse
  sql_limit: 10
